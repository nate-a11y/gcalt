name: Mobile Preview

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish update
        working-directory: ./apps/mobile
        run: |
          eas update --branch=pr-${{ github.event.pull_request.number }} \
            --message "${{ github.event.pull_request.title }}"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const branch = `pr-${prNumber}`;

            const body = `## 📱 Mobile Preview Ready

            Scan the QR code with Expo Go to test this PR:

            | iOS | Android |
            | --- | --- |
            | ![iOS QR](https://qr.expo.dev/eas-update?updateRuntimeVersion=1.0.0&channel=${branch}&platform=ios) | ![Android QR](https://qr.expo.dev/eas-update?updateRuntimeVersion=1.0.0&channel=${branch}&platform=android) |

            Or open directly in Expo Go:
            - [iOS](exp://u.expo.dev/update/${branch}?platform=ios)
            - [Android](exp://u.expo.dev/update/${branch}?platform=android)
            `;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });
